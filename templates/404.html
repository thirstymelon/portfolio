{% extends "base.html" %}

{% block body %}
<main class="main error-page">
    {% include 'partials/nav.html' %}

    <!-- BENTO CONTAINER: single full-bleed cell -->
    <div class="submain">
        <section class="error-box">
            <div class="error-inner">
                <div class="error-glass-card">
                    <div class="card-pattern pattern-dots">
                        <div class="card-noise"></div>
                        <svg class="pattern-svg static-svg" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid slice" fill="none">
                            <defs>
                                <pattern id="dotPatternStatic" width="32" height="32" patternUnits="userSpaceOnUse">
                                    <circle cx="16" cy="16" r="1.25" fill="currentColor" />
                                </pattern>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#dotPatternStatic)" />
                        </svg>
                        <svg class="pattern-svg flow-svg" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid slice" fill="none">
                            <defs>
                                <pattern id="dotPatternFlow" width="32" height="32" patternUnits="userSpaceOnUse">
                                    <circle cx="16" cy="16" r="1.75" fill="currentColor" />
                                </pattern>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#dotPatternFlow)" />
                        </svg>
                    </div>
                    <div class="error-code" aria-label="404">
                        <span class="num-digit">4</span>
                        <span class="num-digit">0</span>
                        <span class="num-digit">4</span>
                    </div>
                    <h1 class="error-title">Page not found</h1>
                    <p class="error-desc">The page you're looking for doesn't exist or has been moved.</p>

                    <div class="cta-cluster">
                        <a href="{{ url_for('home') }}" class="pill-btn" aria-label="Back to home" title="Back to home">
                            <span>Back to home</span>
                        </a>
                        <a href="https://github.com/thirstymelon" class="circle-btn" target="_blank" rel="noopener"
                            title="GitHub" aria-label="GitHub">
                            <svg class="icon-github" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
                                aria-hidden="true" style="pointer-events: none;">
                                <path
                                    d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                            </svg>
                        </a>
                        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=lokesh.panditi.29@gmail.com" target="_blank" rel="noopener noreferrer" class="circle-btn" aria-label="Email via Gmail"
                            title="Email via Gmail (lokesh.panditi.29@gmail.com)">
                            <svg class="icon-mail" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true" style="pointer-events: none;">
                                <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" />
                                <path d="M3 7l8.2 5.7a1.4 1.4 0 0 0 1.6 0L21 7" />
                            </svg>
                        </a>
                    </div>
                </div>

                {% if error_gif %}
                <div class="error-gif-side">
                    <figure class="error-gif-window" aria-hidden="true">
                        <img id="errorGifImg" src="{{ url_for('static', filename='gifs/' ~ error_gif) }}" alt="" loading="eager">
                    </figure>
                    <button type="button" id="shuffleGifBtn" class="gif-roll-btn" aria-label="Roll another random GIF" title="Roll GIF">
                        <svg class="icon-dice" width="17" height="17" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect width="18" height="18" x="3" y="3" rx="4"/>
                            <path d="M16 8h.01"/>
                            <path d="M8 8h.01"/>
                            <path d="M8 16h.01"/>
                            <path d="M16 16h.01"/>
                            <path d="M12 12h.01"/>
                        </svg>
                        <span>Roll GIF</span>
                    </button>
                </div>
                {% endif %}
            </div>
        </section>
    </div>
</main>

<!-- Custom Liquid Cursor Ring -->
<div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='cursor.js') }}"></script>
{% endblock %}
