<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta.title }}</title>
    <meta name="description" content="{{ meta.description }}">
    {%- if meta.keywords %}
    <meta name="keywords" content="{{ meta.keywords }}">
    {%- endif %}
    <meta name="author" content="Lokesh Panditi">
    {%- if meta.robots %}
    <meta name="robots" content="{{ meta.robots }}">
    {%- endif %}
    <meta name="theme-color" content="{{ meta.theme_color }}">

    <!-- OpenGraph & Social Meta -->
    <meta property="og:type" content="{{ meta.og_type }}">
    <meta property="og:title" content="{{ meta.og_title }}">
    <meta property="og:description" content="{{ meta.og_description }}">
    <meta property="og:site_name" content="{{ site.og_site_name }}">
    {%- if meta.og_image %}
    <meta property="og:image" content="{{ meta.og_image if meta.og_image.startswith('http') else site.base_url ~ meta.og_image }}">
    <meta name="twitter:image" content="{{ meta.og_image if meta.og_image.startswith('http') else site.base_url ~ meta.og_image }}">
    {%- endif %}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ meta.og_title }}">
    <meta name="twitter:description" content="{{ meta.og_description }}">

    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="icon" href="{{ url_for('static', filename='favicon-32x32.png') }}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">

    {% include 'partials/theme_init.html' %}

    <!-- Without JS the custom cursor never appears, so keep a real one -->
    <noscript>
        <style>
            @media (hover: hover) and (pointer: fine) {

                *,
                *::before,
                *::after {
                    cursor: auto !important;
                }
            }
        </style>
    </noscript>

    <!-- Fonts: Plus Jakarta Sans + JetBrains Mono (superset of every weight the site uses) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,600&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename=meta.stylesheet) }}">
</head>

<body>
    {% block body %}{% endblock %}

    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
