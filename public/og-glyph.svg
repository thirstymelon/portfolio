<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ff5a1f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a1f"/>
      <stop offset="100%" stop-color="#ff8a4c"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', monospace; }
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle Geometric Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Outer Glass Frame Card -->
  <rect x="48" y="48" width="1104" height="534" rx="24" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Content Container -->
  <g transform="translate(96, 96)">
    <!-- Category Beacon Tag -->
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#ff5a1f" fill-opacity="0.12" stroke="#ff5a1f" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#ff5a1f"/>
    <text x="32" y="22" fill="#ff5a1f" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">HARDWARE CASE STUDY</text>

    <!-- Project Title -->
    <text x="0" y="110" fill="#ffffff" class="sans" font-size="52" font-weight="800" letter-spacing="-1.5">
      ✦ Glyph <tspan fill="url(#orangeGrad)" font-style="italic">Graphics Framework</tspan>
    </text>

    <!-- Subtitle / Pitch -->
    <text x="0" y="175" fill="#94a3b8" class="sans" font-size="22" font-weight="400">
      Building a portable, allocation-free graphics framework for bare-metal Ada 2022.
    </text>
    <text x="0" y="210" fill="#64748b" class="sans" font-size="18" font-weight="400">
      Independent graphics core targeting the RP2040 microcontroller and SSD1306 128×64 OLED.
    </text>

    <!-- Tech Spec Pill Matrix -->
    <g transform="translate(0, 270)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="42" rx="10" fill="#181822" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <text x="16" y="26" fill="#e2e8f0" class="mono" font-size="13" font-weight="600">Ada 2022 Core</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="180" height="42" rx="10" fill="#181822" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <text x="201" y="26" fill="#e2e8f0" class="mono" font-size="13" font-weight="600">RP2040 (Cortex-M0+)</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="180" height="42" rx="10" fill="#181822" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <text x="396" y="26" fill="#e2e8f0" class="mono" font-size="13" font-weight="600">1024B Framebuffer</text>

      <!-- Pill 4 -->
      <rect x="575" y="0" width="180" height="42" rx="10" fill="#181822" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <text x="591" y="26" fill="#e2e8f0" class="mono" font-size="13" font-weight="600">Cohen-Sutherland</text>
    </g>

    <!-- Author & Domain Footer -->
    <g transform="translate(0, 390)">
      <line x1="0" y1="0" x2="912" y2="0" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      <text x="0" y="32" fill="#ffffff" class="sans" font-size="16" font-weight="700">Lokesh Panditi</text>
      <text x="130" y="32" fill="#64748b" class="sans" font-size="16">•</text>
      <text x="150" y="32" fill="#94a3b8" class="mono" font-size="14">Embedded Systems &amp; Firmware</text>

      <text x="912" y="32" text-anchor="end" fill="#ff5a1f" class="mono" font-size="14" font-weight="600">lokeshpanditi.qzz.io/projects/glyph</text>
    </g>
  </g>
</svg>
