<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carrier wave</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8d9097}
@media (max-width: 768px), (hover: none) {
  .carrier-wrap {
    pointer-events: none !important;
    cursor: default !important;
  }
}
</style>
</helmet>
<div class="carrier-wrap" onMouseMove="{{ mm }}" onMouseLeave="{{ ml }}" style="position:relative;width:100%;aspect-ratio:368/184;cursor:crosshair">
<svg width="100%" height="100%" viewBox="0 0 368 184" style="display:block;pointer-events:none" aria-hidden="true">
<line x1="0" y1="92" x2="368" y2="92" stroke="#2a2d34"/>
<path d="{{d1}}" fill="none" stroke="#ecebe6" stroke-opacity=".3"/>
<path d="{{d0}}" fill="none" stroke="#c8ff5a" stroke-width="2"/>
</svg>
<div class="mono" style="{{labStyle}}">Carrier · {{read}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":368,"height":184}}'>
class Component extends DCLogic {
componentDidMount() {
this.s = { tx: 0.35, ty: 0.5, ttx: 0.35, tty: 0.5, on: 0, tg: 0, ph: 0 };
this.last = performance.now();
this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
this.isTouch = () => (typeof window !== 'undefined' && (window.innerWidth <= 768 || (window.matchMedia && window.matchMedia('(hover: none)').matches)));
this.mm = (e) => {
if (this.isTouch()) return;
const r = e.currentTarget.getBoundingClientRect();
this.s.ttx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
this.s.tty = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
this.s.tg = 1;
};
this.ml = () => { this.s.ttx = 0.35; this.s.tty = 0.5; this.s.tg = 0; };
this.loop = (now) => {
const s = this.s;
const dt = Math.min(0.05, (now - this.last) / 1000);
this.last = now;
if (this.isTouch()) {
  s.ttx = 0.35;
  s.tty = 0.5;
  s.tg = 0;
  s.on = 0;
} else {
  s.on += (s.tg - s.on) * 0.1;
}
s.tx += (s.ttx - s.tx) * 0.12;
s.ty += (s.tty - s.ty) * 0.12;
const per = 184 * Math.pow(0.125, s.tx);
s.ph += dt * 2 * Math.PI * 46 / per;
this.setState({ t: now });
this.raf = requestAnimationFrame(this.loop);
};
if (!this.reduce) this.raf = requestAnimationFrame(this.loop);
}
componentWillUnmount() { cancelAnimationFrame(this.raf); }
fmt(f) {
if (f < 1e3) return f.toFixed(f < 100 ? 1 : 0) + ' Hz';
if (f < 1e6) return (f / 1e3).toFixed(1) + ' kHz';
return (f / 1e6).toFixed(2) + ' MHz';
}
renderVals() {
const touch = typeof window !== 'undefined' && (window.innerWidth <= 768 || (window.matchMedia && window.matchMedia('(hover: none)').matches));
const s = this.s || { tx: 0.35, ty: 0.5, on: 0, ph: 0 };
const per = 184 * Math.pow(0.125, s.tx);
const A = 20 + (1 - s.ty) * 52;
let d0 = '', d1 = '';
for (let x = 0; x <= 368; x += 3) {
const y0 = 92 + A * Math.sin(2 * Math.PI * x / per + s.ph);
const y1 = 92 + A * 0.38 * Math.sin(4 * Math.PI * x / per + s.ph * 1.3);
d0 += (x === 0 ? 'M' : ' L') + x + ',' + y0.toFixed(1);
d1 += (x === 0 ? 'M' : ' L') + x + ',' + y1.toFixed(1);
}
const f = 6 * Math.pow(45e6 / 6, s.tx);
const labStyle = touch ? 'display:none!important' : 'position:absolute;left:8px;top:6px;color:#c8ff5a;opacity:' + s.on.toFixed(2);
return { d0, d1, read: this.fmt ? this.fmt(f) : '', labStyle, mm: touch ? null : this.mm, ml: touch ? null : this.ml };
}
}
</script>
</body>
</html>
